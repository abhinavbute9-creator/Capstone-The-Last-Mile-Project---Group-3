/* ============================================================
   SYNTHETIC METRO MODEL
   ------------------------------------------------------------
   Based on published Pune Metro information:
   - official project profile gives maximum speed 80 km/h
   - an official CMP gives scheduled speed about 33 km/h
   - official station lists provide station order
   - a route source gives examples around 0.97-0.98 km between
     several Line 2 stations and ~2.26 min between them.

   We use scheduled speed = 33 km/h as the basis and add a
   small station dwell/operational allowance.
   ============================================================ */

const METRO_SCHEDULED_SPEED_KMPH = 33;

/* Approximate average station dwell/operational allowance. */
const METRO_DWELL_MIN = 0.45;

/*
   Synthetic headway:
   approximately 7 minutes in peak periods and 12 minutes
   off peak. For the demo we use 7 minutes.
*/
const METRO_HEADWAY_MINUTES = 7;

/*
   Station sequences from the official Pune Metro route/station
   information. Only stations represented in YOUR current map
   are included in the calculation.

   Where a station is missing from your current map, it is kept
   out of the interactive route so the map remains consistent
   with your dataset.
*/

const metroLines = {
  "Purple Line": [
    "Nashik Phata",
    "Dapodi",
    "Shivaji Nagar",
    "District Court (Civil Court)",
    "Mahatma Phule Mandai"
  ],

  "Aqua Line": [
    "Paud Phata",
    "Chhatrapati Sambhaji Udyan",
    "PMC Bhavan",
    "District Court (Civil Court)",
    "Pune Railway Station (Metro)",
    "Bund Garden",
    "Ramwadi"
  ]
};

/*
   Approximate straight-line station-to-station distances
   are calculated from the station coordinates.

   To avoid claiming these are surveyed track distances,
   we apply a 1.12 alignment factor to straight-line distance.
*/
const TRACK_ALIGNMENT_FACTOR = 1.12;

/*
   Calculate haversine distance between two stations.
*/
function haversineKm(a, b) {

  const R = 6371;

  const lat1 = a.lat * Math.PI / 180;
  const lat2 = b.lat * Math.PI / 180;

  const dLat = (b.lat - a.lat) * Math.PI / 180;
  const dLng = (b.lng - a.lng) * Math.PI / 180;

  const x =
    Math.sin(dLat / 2) * Math.sin(dLat / 2) +
    Math.cos(lat1) *
    Math.cos(lat2) *
    Math.sin(dLng / 2) *
    Math.sin(dLng / 2);

  return 2 * R * Math.atan2(Math.sqrt(x), Math.sqrt(1 - x));
}

/*
   Find a station in the existing dataset.
*/
function getStationByName(name) {
  return nodes.find(n => n.station_name === name);
}

/*
   Find a route on one of the metro lines.
*/
function findMetroRoute(source, destination) {

  for (const lineName in metroLines) {

    const line = metroLines[lineName];

    const sourceIndex = line.indexOf(source);
    const destinationIndex = line.indexOf(destination);

    if (sourceIndex !== -1 && destinationIndex !== -1) {

      const start = Math.min(sourceIndex, destinationIndex);
      const end = Math.max(sourceIndex, destinationIndex);

      return {
        line: lineName,
        stations: line.slice(start, end + 1),
        numberOfSegments: end - start
      };
    }
  }

  return null;
}

/*
   Calculate synthetic segment time from distance and scheduled speed.

   time = distance / speed * 60 + dwell allowance
*/
function calculateSegmentTime(fromName, toName) {

  const from = getStationByName(fromName);
  const to = getStationByName(toName);

  if (!from || !to) return null;

  const straightDistance = haversineKm(from, to);

  const estimatedTrackDistance =
    straightDistance * TRACK_ALIGNMENT_FACTOR;

  const runningMinutes =
    (estimatedTrackDistance / METRO_SCHEDULED_SPEED_KMPH) * 60;

  return {
    distanceKm: estimatedTrackDistance,
    timeMin: runningMinutes + METRO_DWELL_MIN
  };
}

/*
   Calculate total metro travel time.
*/
function calculateMetroJourney(source, destination) {

  const route = findMetroRoute(source, destination);

  if (!route) return null;

  let totalDistance = 0;
  let trainTime = 0;
  let segments = [];

  for (let i = 0; i < route.stations.length - 1; i++) {

    const from = route.stations[i];
    const to = route.stations[i + 1];

    const segment = calculateSegmentTime(from, to);

    if (!segment) return null;

    totalDistance += segment.distanceKm;
    trainTime += segment.timeMin;

    segments.push({
      from: from,
      to: to,
      distanceKm: segment.distanceKm,
      timeMin: segment.timeMin
    });
  }

  /*
     Expected waiting time for random arrival:
     approximately half the headway.
  */
  const expectedWait = METRO_HEADWAY_MINUTES / 2;

  return {
    line: route.line,
    stations: route.stations,
    segments: segments,
    distanceKm: totalDistance,
    trainTimeMin: trainTime,
    expectedWaitMin: expectedWait,
    totalTimeMin: trainTime + expectedWait
  };
}

/* ============================================================
   ROAD ROUTING
   ============================================================ */

async function calculateRoadTime(sourceNode, destinationNode) {

  const url =
    "https://router.project-osrm.org/route/v1/driving/" +
    sourceNode.lng + "," + sourceNode.lat +
    ";" +
    destinationNode.lng + "," + destinationNode.lat +
    "?overview=false";

  try {

    const response = await fetch(url);
    const data = await response.json();

    if (data.code !== "Ok" || !data.routes.length) {
      throw new Error("Road route unavailable");
    }

    const route = data.routes[0];

    return {
      minutes: Math.max(1, Math.round(route.duration / 60)),
      distanceKm: route.distance / 1000
    };

  } catch (error) {

    console.error(error);

    return null;
  }
}

/* ============================================================
   ROUTE DRAWING
   ============================================================ */

let metroRouteLine = null;

function drawMetroRoute(stationNames) {

  if (metroRouteLine) {
    map.removeLayer(metroRouteLine);
  }

  const coordinates = stationNames
    .map(name => getStationByName(name))
    .filter(Boolean)
    .map(station => [station.lat, station.lng]);

  if (coordinates.length >= 2) {

    metroRouteLine = L.polyline(
      coordinates,
      {
        color: "#1976d2",
        weight: 6,
        opacity: 0.85,
        dashArray: "10,6"
      }
    ).addTo(map);

    map.fitBounds(
      metroRouteLine.getBounds(),
      { padding: [40, 40] }
    );
  }
}

/* ============================================================
   JOURNEY COMPARISON
   ============================================================ */

async function showJourneyComparison(sourceName, destinationName, resultId) {

  const source = getStationByName(sourceName);
  const destination = getStationByName(destinationName);

  const resultBox = document.getElementById(resultId);

  if (!source || !destination) {
    resultBox.innerHTML =
      '<div class="warning">Station data not found.</div>';
    return;
  }

  const metro = calculateMetroJourney(
    sourceName,
    destinationName
  );

  if (!metro) {
    resultBox.innerHTML =
      '<div class="warning">' +
      'A metro route between these stations is not available in the current map dataset.' +
      '</div>';
    return;
  }

  resultBox.innerHTML =
    '<div class="comparison">' +
    'Calculating road travel time...' +
    '</div>';

  const road = await calculateRoadTime(
    source,
    destination
  );

  drawMetroRoute(metro.stations);

  if (!road) {

    resultBox.innerHTML =
      '<div class="comparison">' +
      '<div class="comparison-title">🚇 Metro Journey</div>' +
      '<div class="popup-row">Train time: <b>' +
      metro.trainTimeMin.toFixed(1) +
      ' min</b></div>' +
      '<div class="popup-row">Expected wait: <b>' +
      metro.expectedWaitMin.toFixed(1) +
      ' min</b></div>' +
      '<div class="popup-row">Total Metro: <b class="metro-time">' +
      metro.totalTimeMin.toFixed(1) +
      ' min</b></div>' +
      '<div class="warning">Road routing could not be obtained. Check your internet connection.</div>' +
      '</div>';

    return;
  }

  const difference =
    road.minutes - metro.totalTimeMin;

  let recommendation;

  if (difference > 0) {

    recommendation =
      "🚇 Metro is approximately " +
      difference.toFixed(1) +
      " min faster.";

  } else if (difference < 0) {

    recommendation =
      "🚗 Road is approximately " +
      Math.abs(difference).toFixed(1) +
      " min faster.";

  } else {

    recommendation =
      "Both options take approximately the same time.";
  }

  const segmentText =
    metro.segments.map(s =>
      s.from + " → " +
      s.to + " (" +
      s.distanceKm.toFixed(2) +
      " km, " +
      s.timeMin.toFixed(1) +
      " min)"
    ).join("<br>");

  resultBox.innerHTML =
    '<div class="comparison">' +

    '<div class="comparison-title">' +
    'Journey Comparison' +
    '</div>' +

    '<div class="popup-row">' +
    '🚇 Metro line: <b>' +
    metro.line +
    '</b></div>' +

    '<div class="popup-row">' +
    '📏 Estimated metro distance: <b>' +
    metro.distanceKm.toFixed(2) +
    ' km</b>' +
    '</div>' +

    '<div class="popup-row">' +
    '🚇 Train travel: <b class="metro-time">' +
    metro.trainTimeMin.toFixed(1) +
    ' min</b>' +
    '</div>' +

    '<div class="popup-row">' +
    '⏳ Expected wait: <b>' +
    metro.expectedWaitMin.toFixed(1) +
    ' min</b>' +
    '</div>' +

    '<div class="popup-row">' +
    '🚇 Total Metro: <b class="metro-time">' +
    metro.totalTimeMin.toFixed(1) +
    ' min</b>' +
    '</div>' +

    '<hr>' +

    '<div class="popup-row">' +
    '🚗 Road: <b class="road-time">' +
    road.minutes +
    ' min</b>' +
    '</div>' +

    '<div class="route-info">' +
    'Road distance: ' +
    road.distanceKm.toFixed(1) +
    ' km' +
    '</div>' +

    '<div class="saving">' +
    recommendation +
    '</div>' +

    '<div class="route-info">' +
    '<b>Metro route:</b><br>' +
    metro.stations.join(" → ") +
    '</div>' +

    '<div class="route-info">' +
    '<b>Estimated segment times:</b><br>' +
    segmentText +
    '</div>' +

    '<div class="warning">' +
    'Metro times are synthetic estimates based on a published scheduled speed of about 33 km/h, station coordinates and an alignment factor. They are suitable for this prototype, but should be replaced with official timetable/operational data for production use.' +
    '</div>' +

    '</div>';
}

/* ============================================================
   POPUP
   ============================================================ */

function createMetroPopup(n) {

  const metroStations =
    nodes.filter(node =>
      node.node_type === "Metro Station" &&
      node.station_name !== n.station_name
    );

  let options =
    '<option value="">Select destination</option>';

  metroStations.forEach(station => {

    options +=
      '<option value="' +
      station.station_name +
      '">' +
      station.station_name +
      '</option>';
  });

  return (
    '<div class="metro-popup">' +

    '<h3>🚇 ' +
    n.station_name +
    '</h3>' +

    '<div class="station-type">' +
    n.node_type +
    '</div>' +

    '<div class="popup-row">' +
    'Switch risk: <b>' +
    n.risk_score.toFixed(1) +
    '%</b>' +
    '</div>' +

    '<div class="popup-row">' +
    'Trips observed: ' +
    n.trips +
    '</div>' +

    '<hr>' +

    '<div class="popup-row">' +
    '<b>Where do you want to go?</b>' +
    '</div>' +

    '<select id="destination-' + n.id + '"' +
    ' class="destination-select">' +
    options +
    '</select>' +

    '<button class="plan-button"' +
    ' onclick="planJourney(\'' +
    n.station_name.replace(/'/g, "\\'") +
    '\', \'' +
    n.id +
    '\')">' +
    'Compare Metro vs Road' +
    '</button>' +

    '<div id="journey-result-' +
    n.id +
    '"></div>' +

    '</div>'
  );
}

async function planJourney(sourceName, nodeId) {

  const select =
    document.getElementById(
      "destination-" + nodeId
    );

  const destination = select.value;

  if (!destination) {
    alert("Please select a destination station.");
    return;
  }

  const resultId =
    "journey-result-" + nodeId;

  await showJourneyComparison(
    sourceName,
    destination,
    resultId
  );
}

   ============================================================ */

function riskColor(r) {

  if (r > 50) return '#D85A30';
  if (r > 30) return '#EF9F27';

  return '#1D9E75';
}

function shapeDiv(type, color) {

  if (type === 'Metro Station') {

    return '<div style="' +
      'width:18px;height:18px;border-radius:50%;' +
      'background:' + color + ';border:2px solid #fff;' +
      'box-shadow:0 0 0 1px rgba(0,0,0,0.15);' +
      '"></div>';
  }

  if (type === 'Railway Station') {

    return '<div style="' +
      'width:16px;height:16px;background:' + color + ';' +
      'border:2px solid #fff;border-radius:3px;' +
      'box-shadow:0 0 0 1px rgba(0,0,0,0.15);' +
      '"></div>';
  }

  if (type === 'Bus Terminal') {

    return '<div style="' +
      'width:14px;height:14px;background:' + color + ';' +
      'border:2px solid #fff;border-radius:3px;' +
      'transform:rotate(45deg);' +
      'box-shadow:0 0 0 1px rgba(0,0,0,0.15);' +
      '"></div>';
  }

  return '<div style="' +
    'width:0;height:0;' +
    'border-left:8px solid transparent;' +
    'border-right:8px solid transparent;' +
    'border-bottom:15px solid ' + color + ';' +
    'filter:drop-shadow(0 0 1px rgba(0,0,0,0.15));' +
    '"></div>';
}

   ============================================================ */

const map =
  L.map('map')
   .setView([18.535, 73.865], 12);

L.tileLayer(
  'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  {
    attribution: '&copy; OpenStreetMap contributors',
    maxZoom: 18
  }
).addTo(map);

nodes.forEach(function(n) {

  const c = riskColor(n.risk_score);

  const icon = L.divIcon({
    html: shapeDiv(n.node_type, c),
    className: '',
    iconSize: [20, 20],
    iconAnchor: [10, 10]
  });

  const marker =
    L.marker(
      [n.lat, n.lng],
      { icon: icon }
    ).addTo(map);

  if (n.node_type === "Metro Station") {

    marker.bindPopup(
      createMetroPopup(n)
    );

  } else {

    marker.bindPopup(
      '<div style="min-width:170px">' +

      '<div style="font-weight:600;font-size:13px;margin-bottom:2px">' +
      n.station_name +
      '</div>' +

      '<div style="font-size:12px;color:#666;margin-bottom:6px">' +
      n.node_type +
      '</div>' +

      '<div style="font-size:12px">' +
      'Switch risk: <b style="color:' +
      c + '">' +
      n.risk_score.toFixed(1) +
      '%</b>' +
      '</div>' +

      '<div style="font-size:12px">' +
      'Trips observed: ' +
      n.trips +
      '</div>' +

      '</div>'
    );
  }
});

</script>
</body>
</html>
